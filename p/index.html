<!doctype html>
<!--
  Gyro public link viewer (docs/ARTIFACTS.md §16c). A static page: it reads
  #<token> from its own address, fetches share.json and the entry from the
  public-pages bucket, and shows it. Pages run in a sandboxed srcdoc frame
  (no allow-same-origin, so they can't reach this page) under the policy
  below plus a stricter one scoped to their own folder. Notes are built as
  DOM nodes, never as HTML. Nothing is sent anywhere but the Supabase
  storage origin, and the token never leaves in a Referer.

  Host it on its own domain (not the app's or a marketing site's): a page
  shown here is anyone's HTML. Change SB in both places below if the
  Supabase project changes.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline' https://qnqldkvdwjjrydgtulqj.supabase.co; style-src 'unsafe-inline' https://qnqldkvdwjjrydgtulqj.supabase.co; img-src https://qnqldkvdwjjrydgtulqj.supabase.co data: blob:; font-src https://qnqldkvdwjjrydgtulqj.supabase.co data:; media-src https://qnqldkvdwjjrydgtulqj.supabase.co data: blob:; connect-src https://qnqldkvdwjjrydgtulqj.supabase.co; base-uri https://qnqldkvdwjjrydgtulqj.supabase.co; form-action 'none'; object-src 'none'; worker-src 'none'; manifest-src 'none'">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark light">
<title>Shared with Gyro</title>
<style>
  /* Tokens from src/styles.css (docs/VISUAL.md): dark first, light below. */
  :root {
    color-scheme: dark;
    --bg-app: #13111C; --bg-panel: #1B1827; --bg-raised: #221F2F; --bg-hover: #2B2738;
    --border-subtle: #25222F; --border: #363245;
    --text-1: #EEECF4; --text-2: #B8B4C6; --text-3: #9A95AC;
    --accent: #9877F4; --accent-text: #B5A0FA; --accent-soft: rgba(152,119,244,.16);
    --font-ui: -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, sans-serif;
    --font-mono: "SF Mono", ui-monospace, Menlo, "JetBrains Mono", monospace;
    --t-meta: 400 11px/16px var(--font-ui);
    --t-body: 400 13px/18px var(--font-ui);
    --t-title: 600 14px/20px var(--font-ui);
    --t-mono: 400 12px/18px var(--font-mono);
    --r-xs: 4px; --r-md: 8px; --r-pill: 999px;
    --h-band: 44px;
  }
  @media (prefers-color-scheme: light) {
    :root {
      color-scheme: light;
      --bg-app: #FAF8FE; --bg-panel: #FFFFFF; --bg-raised: #FFFFFF; --bg-hover: #EAE5F5;
      --border-subtle: #E6E2F0; --border: #D4CFE2;
      --text-1: #1C1A24; --text-2: #4F4B5E; --text-3: #655F75;
      --accent: #7C3AED; --accent-text: #6D2FD9; --accent-soft: rgba(124,58,237,.10);
    }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { display: flex; flex-direction: column; background: var(--bg-app); color: var(--text-1); font: var(--t-body); -webkit-font-smoothing: antialiased; }
  ::selection { background: var(--accent-soft); }

  .bar { flex: none; display: flex; align-items: center; gap: 12px; height: var(--h-band); padding: 0 16px; border-bottom: 1px solid var(--border-subtle); background: var(--bg-panel); }
  .bar-text { flex: 1; min-width: 0; display: flex; align-items: baseline; gap: 10px; }
  .title { margin: 0; font: var(--t-title); letter-spacing: -.005em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .meta { flex: none; font: var(--t-meta); color: var(--text-3); font-variant-numeric: tabular-nums; white-space: nowrap; }
  .by { flex: none; display: inline-flex; align-items: center; gap: 6px; font: var(--t-meta); color: var(--text-3); white-space: nowrap; }
  .by svg { color: var(--text-3); }

  main { flex: 1; min-height: 0; display: flex; overflow: auto; }
  .frame { flex: 1; width: 100%; border: 0; background: var(--bg-panel); }
  .picture { margin: auto; padding: 24px; max-width: 100%; max-height: 100%; display: flex; }
  .picture img { max-width: 100%; max-height: calc(100vh - var(--h-band) - 48px); object-fit: contain; border-radius: var(--r-md); }
  .picture img.actual { max-width: none; max-height: none; cursor: zoom-out; }
  .picture img:not(.actual) { cursor: zoom-in; }
  .text { margin: 0; padding: 20px 24px; width: 100%; font: var(--t-mono); color: var(--text-1); white-space: pre; tab-size: 4; }

  .note { width: 100%; max-width: 760px; margin: 0 auto; padding: 32px 24px 64px; font: 400 15px/1.65 var(--font-ui); overflow-wrap: anywhere; }
  .note > :first-child { margin-top: 0; }
  .note h1, .note h2, .note h3, .note h4, .note h5, .note h6 { margin: 1.4em 0 .5em; line-height: 1.3; letter-spacing: -.01em; }
  .note h1 { font-size: 1.75em; } .note h2 { font-size: 1.4em; } .note h3 { font-size: 1.15em; }
  .note h4, .note h5, .note h6 { font-size: 1em; color: var(--text-2); }
  .note p { margin: 0 0 .9em; }
  .note ul, .note ol { margin: 0 0 .9em; padding-left: 24px; }
  .note li { margin: .25em 0; }
  .note li::marker { color: var(--text-3); }
  .note a { color: var(--accent-text); text-decoration: underline; text-underline-offset: 2px; }
  .note code { font: 400 .87em/1 var(--font-mono); padding: 2px 5px; border-radius: var(--r-xs); background: var(--bg-hover); }
  .note pre { margin: 0 0 1em; padding: 12px 14px; border: 1px solid var(--border-subtle); border-radius: var(--r-md); background: var(--bg-raised); overflow: auto; }
  .note pre code { padding: 0; background: none; font: var(--t-mono); white-space: pre; }
  .note blockquote { margin: 0 0 .9em; padding: 0 0 0 14px; border-left: 2px solid var(--border); color: var(--text-2); }
  .note hr { margin: 1.6em 0; border: 0; border-top: 1px solid var(--border); }
  .note table { margin: 0 0 1em; border-collapse: collapse; font-size: .93em; display: block; overflow-x: auto; }
  .note th, .note td { padding: 6px 10px; border: 1px solid var(--border-subtle); text-align: left; vertical-align: top; }
  .note th { font-weight: 600; background: var(--bg-raised); }

  .state { margin: auto; padding: 24px; max-width: 420px; text-align: center; }
  .state h1 { margin: 0 0 6px; font: var(--t-title); }
  .state p { margin: 0; color: var(--text-2); }
  .loading { margin: auto; font: var(--t-meta); color: var(--text-3); }

  @media (max-width: 560px) {
    .meta { display: none; }
    .note { padding: 24px 16px 48px; }
  }
</style>
</head>
<body>
<header class="bar">
  <div class="bar-text">
    <h1 class="title" id="title"></h1>
    <span class="meta" id="meta"></span>
  </div>
  <span class="by" title="Shared with Gyro">
    <svg width="12" height="12" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="8" cy="8" r="6"/><path d="M2 8h12"/><path d="M8 2c1.8 1.7 2.6 3.7 2.6 6s-.8 4.3-2.6 6c-1.8-1.7-2.6-3.7-2.6-6S6.2 3.7 8 2z"/></svg>
    Shared with Gyro
  </span>
</header>
<main id="main"><div class="loading" role="status">Loading…</div></main>
<script>
(function () {
  'use strict';
  var SB = 'https://qnqldkvdwjjrydgtulqj.supabase.co';
  var BUCKET = SB + '/storage/v1/object/public/public-pages/';
  var TOKEN_RE = /^[A-Za-z0-9_-]{24}$/;
  var PATH_RE = /^[A-Za-z0-9._-]+(\/[A-Za-z0-9._-]+){0,2}$/;
  var KINDS = { page: 'Page', image: 'Picture', note: 'Note', text: 'Text' };
  var MAX_TEXT = 5 * 1024 * 1024;
  var MONTHS = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
  // First script of every page, as in the app (protocol.cjs NO_WEBRTC):
  // WebRTC isn't covered by connect-src.
  var NO_WEBRTC = "<script>(function(){for(var k of ['RTCPeerConnection','webkitRTCPeerConnection','RTCDataChannel','RTCIceTransport','RTCDtlsTransport','RTCSctpTransport'])try{Object.defineProperty(window,k,{value:undefined,writable:false,configurable:false})}catch(e){}})()<\/script>";

  var main = document.getElementById('main');
  var el = function (tag, cls, text) {
    var n = document.createElement(tag);
    if (cls) n.className = cls;
    if (text != null) n.textContent = text;
    return n;
  };
  var show = function (node) {
    main.replaceChildren(node);
  };
  function fail(title, line) {
    var box = el('div', 'state');
    box.setAttribute('role', 'status');
    box.append(el('h1', '', title), el('p', '', line));
    show(box);
    document.title = 'Shared with Gyro';
  }
  var validPath = function (p) {
    return typeof p === 'string' && p.length <= 200 && PATH_RE.test(p) && !p.split('/').some(function (x) { return x.charAt(0) === '.'; });
  };
  var encodePath = function (p) {
    return p.split('/').map(encodeURIComponent).join('/');
  };
  function dateOf(iso) {
    var t = Date.parse(iso || '');
    if (!t) return '';
    var d = new Date(t);
    var now = new Date();
    return MONTHS[d.getMonth()] + ' ' + d.getDate() + (d.getFullYear() !== now.getFullYear() ? ', ' + d.getFullYear() : '');
  }

  // ---- the page, in a sandboxed frame ------------------------------------
  // Its <base> points at its own folder, so its styles, scripts and pictures
  // load from there; its own policy allows that folder and nothing else
  // (no network calls, no other page's files), like the app's frame.
  function pagePolicy(folder) {
    return "default-src 'none'; script-src 'unsafe-inline' " + folder + "; style-src 'unsafe-inline' " + folder + '; img-src ' + folder + ' data: blob:; font-src ' + folder + ' data:; media-src ' + folder + " data: blob:; connect-src 'none'; worker-src 'none'; form-action 'none'; frame-src 'none'; object-src 'none'; base-uri " + folder;
  }
  function withHead(html, folder) {
    var head = '<meta charset="utf-8"><base href="' + folder + '"><meta http-equiv="Content-Security-Policy" content="' + pagePolicy(folder) + '"><meta name="referrer" content="no-referrer">' + NO_WEBRTC;
    var m = /<head(?:\s[^>]*)?>/i.exec(html);
    if (m) return html.slice(0, m.index + m[0].length) + head + html.slice(m.index + m[0].length);
    var d = /^﻿?\s*<!doctype[^>]*>/i.exec(html);
    if (d) return html.slice(0, d[0].length) + head + html.slice(d[0].length);
    return head + html;
  }
  function showPage(html, folder, title) {
    var f = el('iframe', 'frame');
    f.setAttribute('sandbox', 'allow-scripts');
    f.setAttribute('referrerpolicy', 'no-referrer');
    f.setAttribute('title', title);
    f.srcdoc = withHead(html, folder);
    show(f);
  }

  function showPicture(url, title) {
    var box = el('div', 'picture');
    var img = el('img');
    img.alt = title;
    img.referrerPolicy = 'no-referrer';
    img.src = url;
    img.addEventListener('click', function () { img.classList.toggle('actual'); });
    img.addEventListener('error', function () { fail('This picture didn’t load.', 'Try again in a minute.'); });
    box.append(img);
    show(box);
  }

  // ---- notes: a small Markdown renderer that only makes DOM nodes --------
  var INLINE = [
    { re: /\[([^\]\n]+)\]\(([^)\s]+)(?:\s+"[^"]*")?\)/, make: function (m) { return link(m[2], m[1]); } },
    { re: /`([^`\n]+)`/, make: function (m) { return el('code', '', m[1]); } },
    { re: /\*\*([^*\n](?:[^*\n]|\*(?!\*))*?)\*\*/, make: function (m) { return wrap('strong', m[1]); } },
    { re: /__([^_\n]+?)__/, make: function (m) { return wrap('strong', m[1]); } },
    { re: /~~([^~\n]+?)~~/, make: function (m) { return wrap('s', m[1]); } },
    { re: /(^|[^\w*])\*([^*\s][^*\n]*?)\*(?!\w)/, make: function (m) { return [document.createTextNode(m[1]), wrap('em', m[2])]; } },
    { re: /(^|[^\w])_([^_\s][^_\n]*?)_(?!\w)/, make: function (m) { return [document.createTextNode(m[1]), wrap('em', m[2])]; } },
    { re: /https?:\/\/[^\s<>()]+[^\s<>().,;:!?'"’”]/, make: function (m) { return link(m[0], m[0]); } }
  ];
  function link(href, text) {
    // Only web links, opened outside this page; anything else is plain text.
    if (!/^https?:\/\//i.test(href)) return wrap('span', text);
    var a = wrap('a', text);
    a.href = href;
    a.target = '_blank';
    a.rel = 'noopener noreferrer nofollow';
    return a;
  }
  function wrap(tag, text) {
    var n = el(tag);
    n.append.apply(n, inline(text));
    return n;
  }
  function inline(text) {
    var out = [];
    var s = String(text || '');
    var guard = 0;
    while (s && guard++ < 5000) {
      var best = null;
      for (var i = 0; i < INLINE.length; i++) {
        var m = INLINE[i].re.exec(s);
        if (m && (!best || m.index < best.m.index)) best = { m: m, r: INLINE[i] };
      }
      if (!best) { out.push(document.createTextNode(s)); break; }
      if (best.m.index > 0) out.push(document.createTextNode(s.slice(0, best.m.index)));
      var made = best.r.make(best.m);
      if (Array.isArray(made)) out.push.apply(out, made); else out.push(made);
      s = s.slice(best.m.index + best.m[0].length);
    }
    return out;
  }
  var FENCE = /^\s*(`{3,}|~{3,})/;
  var HEADING = /^(#{1,6})\s+(.*?)\s*#*\s*$/;
  var BULLET = /^\s*([-*+]|\d{1,9}[.)])\s+(.*)$/;
  var RULE = /^\s*([-*_])(\s*\1){2,}\s*$/;
  var TABLE_SEP = /^\s*\|?\s*:?-{2,}:?\s*(\|\s*:?-{2,}:?\s*)*\|?\s*$/;
  var cells = function (line) {
    return line.trim().replace(/^\|/, '').replace(/\|$/, '').split('|').map(function (c) { return c.trim(); });
  };
  function markdown(text) {
    var root = el('article', 'note');
    var lines = String(text).replace(/\r\n?/g, '\n').split('\n');
    var i = 0;
    while (i < lines.length) {
      var line = lines[i];
      if (!line.trim()) { i++; continue; }
      var f = FENCE.exec(line);
      if (f) {
        var body = [];
        i++;
        while (i < lines.length && !(lines[i].trim().indexOf(f[1]) === 0)) body.push(lines[i++]);
        i++;
        var pre = el('pre');
        pre.append(el('code', '', body.join('\n')));
        root.append(pre);
        continue;
      }
      var h = HEADING.exec(line);
      if (h) { root.append(wrap('h' + h[1].length, h[2])); i++; continue; }
      if (RULE.test(line)) { root.append(el('hr')); i++; continue; }
      if (/^\s*>/.test(line)) {
        var quote = [];
        while (i < lines.length && /^\s*>/.test(lines[i])) quote.push(lines[i++].replace(/^\s*>\s?/, ''));
        var bq = el('blockquote');
        var inner = markdown(quote.join('\n'));
        while (inner.firstChild) bq.append(inner.firstChild);
        root.append(bq);
        continue;
      }
      if (line.indexOf('|') !== -1 && i + 1 < lines.length && TABLE_SEP.test(lines[i + 1])) {
        var table = el('table');
        var tr = el('tr');
        cells(line).forEach(function (c) { tr.append(wrap('th', c)); });
        var thead = el('thead');
        thead.append(tr);
        table.append(thead);
        var tbody = el('tbody');
        i += 2;
        while (i < lines.length && lines[i].indexOf('|') !== -1 && lines[i].trim()) {
          var row = el('tr');
          cells(lines[i++]).forEach(function (c) { row.append(wrap('td', c)); });
          tbody.append(row);
        }
        table.append(tbody);
        root.append(table);
        continue;
      }
      var b = BULLET.exec(line);
      if (b) {
        var ordered = /\d/.test(b[1]);
        var list = el(ordered ? 'ol' : 'ul');
        while (i < lines.length) {
          var lb = BULLET.exec(lines[i]);
          if (!lb || /\d/.test(lb[1]) !== ordered) break;
          var li = wrap('li', lb[2].replace(/^\[( |x|X)\]\s+/, function (_, x) { return x === ' ' ? '☐ ' : '☑ '; }));
          list.append(li);
          i++;
          while (i < lines.length && /^\s{2,}\S/.test(lines[i]) && !BULLET.exec(lines[i])) li.append(document.createTextNode(' '), wrap('span', lines[i++].trim()));
        }
        root.append(list);
        continue;
      }
      var para = [];
      while (i < lines.length && lines[i].trim() && !FENCE.test(lines[i]) && !HEADING.test(lines[i]) && !/^\s*>/.test(lines[i]) && !BULLET.test(lines[i]) && !RULE.test(lines[i])) para.push(lines[i++].trim());
      root.append(wrap('p', para.join(' ')));
    }
    return root;
  }

  // ---- load ---------------------------------------------------------------
  function getText(url) {
    return fetch(url, { cache: 'no-cache', credentials: 'omit', referrerPolicy: 'no-referrer', redirect: 'error' }).then(function (r) {
      if (!r.ok) throw Object.assign(new Error('status ' + r.status), { status: r.status });
      var n = Number(r.headers.get('content-length') || 0);
      if (n > MAX_TEXT) throw Object.assign(new Error('too big'), { tooBig: true });
      return r.text();
    });
  }

  var token = (/^#([A-Za-z0-9_-]{24})$/.exec(location.hash) || [])[1] || '';
  if (!TOKEN_RE.test(token)) return fail('This link isn’t complete.', 'Check that you copied all of it.');
  var folder = BUCKET + token + '/';
  getText(folder + 'share.json?t=' + Date.now())
    .then(function (raw) {
      var s;
      try { s = JSON.parse(raw); } catch (e) { s = null; }
      if (!s || typeof s !== 'object' || !KINDS[s.kind] || !validPath(s.entry)) throw new Error('bad share.json');
      var title = String(s.title || 'Untitled').slice(0, 80);
      var rev = Number(s.rev) > 0 ? Math.floor(Number(s.rev)) : 1;
      document.getElementById('title').textContent = title;
      var when = dateOf(s.updated);
      document.getElementById('meta').textContent = KINDS[s.kind] + (when ? ' · updated ' + when : '');
      document.title = title;
      var url = folder + encodePath(s.entry) + '?v=' + rev;
      if (s.kind === 'image') return showPicture(url, title);
      return getText(url).then(function (text) {
        if (text.length > MAX_TEXT) throw Object.assign(new Error('too big'), { tooBig: true });
        if (s.kind === 'page') return showPage(text, folder, title);
        if (s.kind === 'note') return show(markdown(text));
        show(el('pre', 'text', text));
      });
    })
    .catch(function (e) {
      if (e && e.tooBig) return fail('This is too big to show here.', 'Ask the person who shared it for a copy.');
      if (e && (e.status === 400 || e.status === 404)) return fail('This link doesn’t work any more.', 'The person who shared it may have stopped sharing it.');
      fail('This didn’t load.', 'Check your connection and try again.');
    });
  window.addEventListener('hashchange', function () { location.reload(); });
})();
</script>
</body>
</html>
